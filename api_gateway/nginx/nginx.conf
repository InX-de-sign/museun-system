events {
    worker_connections 1024;
}

http {
    # Your three services
    upstream chatbot {
        server chatbot:8000;
    }
    
    upstream cv_service {
        server cv-service:8000;
    }
    
    upstream localization {
        server localization:8000;
    }

    server {
        listen 80;

        # Route: http://localhost/api/chatbot -> chatbot service
        location /api/chatbot {
            proxy_pass http://chatbot;
            proxy_set_header Host $host;
        }

        # Route: http://localhost/api/cv -> cv service  
        location /api/cv {
            proxy_pass http://cv_service;
            proxy_set_header Host $host;
            client_max_body_size 50M;  # For image uploads
        }

        # Route: http://localhost/api/localization -> localization service
        location /api/localization {
            proxy_pass http://localization;
            proxy_set_header Host $host;
        }

        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}