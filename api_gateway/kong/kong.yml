_format_version: "3.0"

# Define your services
services:
  - name: chatbot-service
    url: http://chatbot:8000
    routes:
      - name: chatbot-route
        paths:
          - /api/chatbot
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 10000
      - name: cors
        config:
          origins: ["*"]
          
  - name: cv-service
    url: http://cv-service:8000
    routes:
      - name: cv-route
        paths:
          - /api/cv
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 50
          
  - name: localization-service
    url: http://localization:8000
    routes:
      - name: localization-route
        paths:
          - /api/localization
        strip_path: false

# Global plugins
plugins:
  - name: prometheus    # Metrics
  - name: ip-restriction
    config:
      allow: ["0.0.0.0/0"]  # Allow all IPs (configure for production)