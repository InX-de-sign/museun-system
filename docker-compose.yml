# orchastrating all services together
version: '3.8'

services:
  # Simple Nginx setup
  # nginx:
  #   image: nginx:alpine        # Use official Nginx image
  #   container_name: api_gateway
  #   ports:
  #     - "80:80"                # Expose port 80
  #     - "443:443"              # HTTPS (optional)
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # Mount config
  #   depends_on:
  #     - chatbot
  #     # - cv-service           # Uncomment when CV service is ready
  #     # - localization         # Uncomment when localization is ready
  #   networks:
  #     - museum_network
  #   restart: unless-stopped

  # Chatbot Service (FastAPI)
  chatbot:
    build: 
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: museum_chatbot
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://museum_user:museum_pass@postgres:5432/museum_db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}  # Add to .env file
      - CV_SERVICE_URL=http://museum_cv:8001
    depends_on:
      - postgres
      - redis
      - museum_cv
    volumes:
      - ./chatbot:/app
      - chatbot_logs:/app/logs
    networks:
      - museum_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # CV Service (YOLO) - Commented out until ready
  museum_cv:
    build:
      context: ./cv
      dockerfile: Dockerfile
    container_name: museum_cv
    ports:
      - "8001:8001"
    environment:
      - MODEL_PATH=/app/models
      - CHATBOT_URL=http://museum_chatbot:8000
    volumes:
      - ./cv:/app
      # - ./models:/app/modelse
    networks:
      - museum_network
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Localization Service - Commented out until ready
  # localization:
  #   build:
  #     context: ./localization
  #     dockerfile: Dockerfile
  #   container_name: museum_localization
  #   ports:
  #     - "8002:8002"
  #   environment:
  #     - INFLUXDB_URL=http://influxdb:8086
  #   depends_on:
  #     - influxdb
  #   networks:
  #     - museum_network
  #   restart: unless-stopped

  # Analytics Service - Commented out until ready
  # analytics:
  #   build:
  #     context: ./analytics
  #     dockerfile: Dockerfile
  #   container_name: museum_analytics
  #   ports:
  #     - "8003:8003"
  #   depends_on:
  #     - postgres
  #     - redis
  #   networks:
  #     - museum_network
  #   restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: museum_postgres
    environment:
      POSTGRES_DB: museum_db
      POSTGRES_USER: museum_user
      POSTGRES_PASSWORD: museum_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - museum_network
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:6-alpine
    container_name: museum_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - museum_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Vector Database (for embeddings)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: museum_vectordb
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - museum_network
    restart: unless-stopped

# Define volumes
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  chatbot_logs:

# Define network
networks:
  museum_network:
    driver: bridge


