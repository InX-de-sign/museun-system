# Orchestrating all services together - WITH ZOO DATABASE
# version: '3.8'

services:
  # Chatbot Service (FastAPI)
  chatbot:
    build: 
      context: ./chatbot
      dockerfile: Dockerfile
    container_name: museum_chatbot
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://zoo_user:zoo_password_2024@postgres:5432/zoo_db
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CV_SERVICE_URL=http://yolo_inference:5000
      - HOST=0.0.0.0
      # PostgreSQL Zoo Database
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=zoo_db
      - POSTGRES_USER=zoo_user
      - POSTGRES_PASSWORD=zoo_password_2024
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./chatbot:/app
      - chatbot_logs:/app/logs
    networks:
      - museum_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # YOLO Inference Service - Receives frames from Raspberry Pi webcam_client
  yolo_inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    container_name: yolo_inference
    ports:
      - "5000:5000"
    environment:
      - MODEL_PATH=/app/models/best.onnx
      - CHATBOT_URL=http://museum_chatbot:8000
      - INFERENCE_INTERVAL=0.5
      - DETECTION_COOLDOWN=5
      - IMGSZ=640
      - CONF_THRESHOLD=0.75
      - DEVICE=cpu
    volumes:
      - ./inference:/app
    working_dir: /app
    command: bash -c "apt update && apt install -y libgl1 && pip install -r requirements.txt && python -m uvicorn model_api:app --host 0.0.0.0 --port 5000"
    depends_on:
      - chatbot
    networks:
      - museum_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database - UPDATED FOR ZOO
  postgres:
    image: postgres:15-alpine
    container_name: museum_postgres
    environment:
      POSTGRES_DB: zoo_db
      POSTGRES_USER: zoo_user
      POSTGRES_PASSWORD: zoo_password_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount SQL initialization scripts for zoo database
      - ./chatbot/03_create_zoo_database.sql:/docker-entrypoint-initdb.d/01_create_zoo_database.sql
      - ./chatbot/04_populate_zoo_data.sql:/docker-entrypoint-initdb.d/02_populate_zoo_data.sql
    ports:
      - "5432:5432"
    networks:
      - museum_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoo_user -d zoo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgAdmin (optional - for database management GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: museum_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zoo.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - museum_network
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:6-alpine
    container_name: museum_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - museum_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Vector Database (for embeddings)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: museum_vectordb
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - museum_network
    restart: unless-stopped

# Define volumes
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  chatbot_logs:
  pgadmin_data:

# Define network
networks:
  museum_network:
    driver: bridge