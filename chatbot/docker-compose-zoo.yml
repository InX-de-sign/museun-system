version: '3.8'

services:
  # PostgreSQL Database for Zoo Chatbot
  postgres:
    image: postgres:15-alpine
    container_name: zoo_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zoo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoo_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-zoo_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount SQL initialization scripts
      - ./03_create_zoo_database.sql:/docker-entrypoint-initdb.d/01_create_zoo_database.sql
      - ./04_populate_zoo_data.sql:/docker-entrypoint-initdb.d/02_populate_zoo_data.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zoo_user} -d ${POSTGRES_DB:-zoo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin (optional - for database management GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zoo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@zoo.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  # Zoo AI Chatbot Service (optional - uncomment when ready)
  # zoo_chatbot:
  #   build: .
  #   container_name: zoo_chatbot
  #   environment:
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #     POSTGRES_DB: ${POSTGRES_DB:-zoo_db}
  #     POSTGRES_USER: ${POSTGRES_USER:-zoo_user}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoo_password_change_me}
  #     OPENAI_API_KEY: ${OPENAI_API_KEY}
  #     AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres
  #   volumes:
  #     - ./:/app
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: zoo_network